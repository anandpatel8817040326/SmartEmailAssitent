# Application Configuration
spring.application.name=smart-email-assistant
server.port=8080

# Database Configuration (File-based H2 for persistent history)
spring.datasource.url=jdbc:h2:file:./data/emaildb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Ollama Local AI Configuration
ollama.api.url=http://localhost:11434
ollama.model.name=llama3.2

# Email / SMTP Configuration (e.g. Gmail SMTP or Mailtrap)
# Configure your credentials dynamically via the UI Settings modal or environment variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=noreply@smart-ai-assistant.com

